var S = null;
var lastAct = Date.now();

function $(s, el) { return (el || document).querySelector(s); }

// ---------- API ----------
// Read-only answers are kept for 5 minutes: a section opened before shows instantly and

async function waitConfirm(pc) {

    if (st.status === 'confirmed') { closeModal(); return api('confirmation.execute', { id: pc.id }); }
    if (st.status === 'rejected') { closeModal(); throw new Error('Действие отклонено в боте'); }
    if (st.status === 'expired') { closeModal(); throw new Error('Время подтверждения истекло'); }
  }
  if (cancelled) throw new Error('Отменено');
  closeModal();
  throw new Error('Время подтверждения истекло');
}

async function guard(fn, okMsg) {
  try { await fn(); if (okMsg) toast(okMsg); route(); }
  catch (e) { if (e.message === 'Отменено') return; toast(errText(e), true); }
}

// ---------- UI helpers ----------
function modal(html) {
  closeModal();
  var m = document.createElement('div');
  m.className = 'mback';
  m.innerHTML = '<div class="modal" role="dialog">' + html + '</div>';
  document.body.appendChild(m);
  m.addEventListener('click', function (e) { if (e.target === m && !m.dataset.lock) closeModal(); });
  return m;
}
function closeModal() { document.querySelectorAll('.mback').forEach(function (x) { x.remove(); }); }
function toast(msg, bad) {
  var t = document.createElement('div');
  t.className = 'toast' + (bad ? ' bad' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  if (TGAPP) { try { TGAPP.HapticFeedback.notificationOccurred(bad ? 'error' : 'success'); } catch (e) {} }
  setTimeout(function () { t.remove(); }, bad ? 5000 : 2500);
}
function ask(title, body, okText, danger) {
  return new Promise(function (resolve) {
    var m = modal('<h3>' + esc(title) + '</h3>' + body + '<div class="mact"><button class="btn" data-x="no">Отмена</button><button class="btn ' + (danger ? 'danger' : 'pri') + '" data-x="ok">' + esc(okText || 'Готово') + '</button></div>');
    m.dataset.lock = '1';
    m.addEventListener('click', function (e) {
      var b = e.target.closest('[data-x]');
      if (!b) return;
      if (b.dataset.x === 'ok') {
        var v = {};
        m.querySelectorAll('[name]').forEach(function (i) { v[i.name] = i.value; });
        closeModal(); resolve(v);
      } else { closeModal(); resolve(null); }
    });
    var f = m.querySelector('[name]'); if (f) f.focus();
  });
}
function tabs(items, cur, key) {
  return '<div class="tabs">' + items.map(function (it) {
    return '<button class="tab' + (it[0] === cur ? ' on' : '') + '" data-do="tab" data-k="' + key + '" data-v="' + esc(it[0]) + '">' + esc(it[1]) + '</button>';
  }).join('') + '</div>';
}
function pager(res, qs) {
  var page = +qs.get('page') || 1;
  var pages = Math.max(1, Math.ceil(res.total / res.size));
  if (pages <= 1) return '';
  return '<div class="pager"><button class="btn sm" data-do="page" data-p="' + (page - 1) + '"' + (page <= 1 ? ' disabled' : '') + '>←</button><span class="mut">' + page + ' / ' + pages + ' · всего ' + res.total + '</span><button class="btn sm" data-do="page" data-p="' + (page + 1) + '"' + (page >= pages ? ' disabled' : '') + '>→</button></div>';
}
function searchBar(key, val, ph) {
  return '<div class="bar"><input class="inp" id="q-' + key + '" data-enter="fsearch" data-key="' + key + '" placeholder="' + esc(ph) + '" value="' + esc(val) + '"><button class="btn pri" data-do="fsearchbtn" data-key="' + key + '">Найти</button></div>';
}
function empty(t) { return '<div class="card mut">' + esc(t) + '</div>'; }
function nav(upd, path) {
  var raw = location.hash.slice(1) || '/dashboard';
  var parts = raw.split('?');
  var qs = new URLSearchParams(parts[1] || '');
  Object.keys(upd).forEach(function (k) { if (upd[k] === '' || upd[k] == null) qs.delete(k); else qs.set(k, upd[k]); });
  var s = qs.toString();
  var next = '#' + (path || parts[0]) + (s ? '?' + s : '');
  if (next === location.hash) route(); else location.hash = next;
}

  more: svg('<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>'),
  lock: svg('<rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 018 0v3"/><circle cx="12" cy="15.5" r="1.3"/>')
};
function inTabs(n) { return TABS.some(function (t) { return t[0] === n; }); }
function moreSheet() {
  var cur = curView();
  var items = NAV.filter(function (n) { return !inTabs(n[0]) && can(MIN[n[0]] || 1); });
  var m = modal('<h3>Разделы</h3><div class="sheet">' + items.map(function (n) {
    return '<a href="#/' + n[0] + '"' + (n[0] === cur ? ' class="on"' : '') + '>' + n[1] + '</a>';
  }).join('') + '</div><div class="mact"><button class="btn" data-x="no">Закрыть</button></div>');
  m.addEventListener('click', function (e) { if (e.target.closest('a,[data-x]')) closeModal(); });
}
function curView() { return ((location.hash.slice(1) || '/dashboard').split('?')[0].split('/').filter(Boolean)[0]) || 'dashboard'; }

async function route(quiet) {
  if (!S) return;
  var seq = ++RS;
  var raw = location.hash.slice(1) || '/dashboard';
  var parts0 = raw.split('?');
  var parts = parts0[0].split('/').filter(Boolean);
  var name = parts[0] || 'dashboard';
  if (!VIEWS[name] || !can(MIN[name] || 1)) { location.hash = '#/dashboard'; return; }
  document.querySelectorAll('#nav a').forEach(function (a) { a.classList.toggle('on', a.dataset.n === name); });
  document.querySelectorAll('#tabbar a').forEach(function (a) { a.classList.toggle('on', a.dataset.n === (inTabs(name) ? name : 'more')); });
  tgBack(name !== 'dashboard' || !!parts[1]);
  var main = $('#main');
  var pass = { used: [], hit: false, done: false };
  PASS = pass;
  // show "loading" only if the answer takes noticeably long (cached sections render at once)
  var lt = quiet ? 0 : setTimeout(function () { if (seq === RS && !pass.done) main.innerHTML = '<div class="mut pad">Загрузка…</div>'; }, 150);
  try {
    await VIEWS[name](main, parts[1], new URLSearchParams(parts0[1] || ''));
    if (name === 'dashboard') adminHomeCard();
  } catch (e) {
    pass.hit = false;
    if (!S || seq !== RS) return;
    main.innerHTML = '<div class="card"><p>' + esc(errText(e)) + '</p><button class="btn" data-do="reload">Повторить</button></div>';
  } finally {
    pass.done = true;
    if (lt) clearTimeout(lt);
    if (PASS === pass) PASS = null;
  }
  if (seq !== RS) return;
  if (!quiet) window.scrollTo(0, 0);
  if (pass.hit && await revalidate(pass.used) && seq === RS && S) {
    var f = document.activeElement;
    var typing = f && main.contains(f) && /^(INPUT|TEXTAREA|SELECT)$/.test(f.tagName);
    if (!typing && !document.querySelector('.mback')) route(true);
  }
}
window.addEventListener('hashchange', function () { route(); });

// ---------- session ----------
function save() { try { sessionStorage.setItem('adm', JSON.stringify(S)); } catch (e) {} }
function stopTimers() { timers.forEach(clearInterval); timers = []; }

function logout(msg) {
  S = null;
  CACHE = {};
  try { sessionStorage.removeItem('adm'); } catch (e) {}
  stopTimers();
  closeModal();
  showLogin(msg);
}

function startApp() {
  renderShell();
  if (!Object.keys(VT).length) loadVT();
  stopTimers();
  lastAct = Date.now();
  timers.push(setInterval(async function () {
    if (!S) return;
    var now = Date.now() / 1000;
    if (now > S.abs) { logout(ERR.session_expired); return; }
    if (S.exp - now < 300) {
      try { var d = await api('refresh'); S.token = d.token; S.exp = d.expires_at; save(); } catch (e) {}
    }
  }, 60000));
  timers.push(setInterval(function () {
    if (S && Date.now() - lastAct > 20 * 60 * 1000) logout('Вы вышли из-за неактивности');
  }, 30000));
  route();
}

async function doLogin(body) {
  try {
    var d = await api('login', body);
    S = { token: d.token, exp: d.expires_at, abs: d.absolute_expires_at, role: d.role, name: d.name };
    save();
    startApp();
  } catch (e) { showLogin(errText(e), true); }
}

window.onTelegramAuth = function (user) { doLogin({ widget: user }); };

function showLogin(msg, noAuto) {
  $('#app').innerHTML = '<div class="login"><div class="card"><div class="logo">adl<small>cargo · админ-панель</small></div><div id="lbox" style="margin-top:22px"></div><div class="err" id="lerr">' + esc(msg || '') + '</div></div></div>';
  var box = $('#lbox');
  if (TGAPP) {
    if (!msg && !noAuto) {
      box.innerHTML = '<div class="spin"></div><div class="mut">Входим…</div>';
      doLogin({ initData: TGAPP.initData });
    } else {
      box.innerHTML = '<button class="btn pri" id="retry">Войти снова</button>';
      $('#retry').onclick = function () { showLogin(); };
    }
    return;
  }
  box.innerHTML = '<p class="mut">Войдите через Telegram. Доступ только у сотрудников.</p>';
  var s = document.createElement('script');
  s.async = true;
  s.src = 'https://telegram.org/js/telegram-widget.js?22';
  s.setAttribute('data-telegram-login', BOT);
  s.setAttribute('data-size', 'large');
  s.setAttribute('data-radius', '10');
  s.setAttribute('data-auth-url', location.origin + location.pathname);
  s.setAttribute('data-request-access', 'write');
  box.appendChild(s);
}

// ---------- Telegram Mini App ----------
function tgv(v) { try { return !!(TGAPP && TGAPP.isVersionAtLeast(v)); } catch (e) { return false; } }
function tgColors() {
  if (!tgv('6.1')) return;
  try {
    var bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
    var sf = getComputedStyle(document.documentElement).getPropertyValue('--surf').trim();
    TGAPP.setHeaderColor(sf); TGAPP.setBackgroundColor(bg);
    if (tgv('7.10')) TGAPP.setBottomBarColor(sf);
  } catch (e) {}
}
var navMoves = 0;
window.addEventListener('hashchange', function () { navMoves++; });
function tgBack(show) {
  if (!tgv('6.1')) return;
  try { if (show) TGAPP.BackButton.show(); else TGAPP.BackButton.hide(); } catch (e) {}
}
function onTgBack() {
  // an open dialog closes first (same as its "Отмена" button)
  var no = document.querySelector('.mback [data-x="no"]');
  if (no) { no.click(); return; }
  if (document.querySelector('.mback')) { closeModal(); return; }
  var parts = (location.hash.slice(1) || '/dashboard').split('?')[0].split('/').filter(Boolean);
  if (navMoves > 0) { navMoves -= 2; history.back(); return; }
  location.hash = parts[1] ? '#/' + parts[0] : '#/dashboard';
}

// ---------- biometric lock (Face ID / fingerprint) ----------
// Guards against someone holding the admin's unlocked phone. Real access control stays on the server.
var BIO_IDLE = 5 * 60 * 1000;
var bioHiddenAt = 0;
function bioMgr() { return tgv('7.2') && TGAPP.BiometricManager ? TGAPP.BiometricManager : null; }
function bioInit(bm) { return new Promise(function (r) { if (bm.isInited) return r(); try { bm.init(function () { r(); }); } catch (e) { r(); } setTimeout(r, 3000); }); }
function bioAccess(bm) {
  return new Promise(function (r) {
    if (bm.isAccessRequested) return r(bm.isAccessGranted);
    try { bm.requestAccess({ reason: 'Нужно для защиты админ-панели ADL Cargo' }, function (ok) { r(!!ok); }); } catch (e) { r(false); }
  });
}
function bioAuth(bm) {
  return new Promise(function (r) {
    try { bm.authenticate({ reason: 'Вход в админ-панель ADL Cargo' }, function (ok) { r(!!ok); }); } catch (e) { r(false); }
  });
}
// Resolves once the person passed biometrics, or right away when the device has none.
async function bioGate() {
  var bm = bioMgr();
  if (!bm) return;
  await bioInit(bm);
  if (!bm.isInited || !bm.isBiometricAvailable) return;
  var el = document.createElement('div');
  el.className = 'lock';
  document.body.appendChild(el);
  try {
    for (;;) {
      var granted = await bioAccess(bm);
      if (!granted) {
        await lockScreen(el, 'Разрешите доступ к ' + (bm.biometricType === 'face' ? 'Face ID' : 'отпечатку') + ' в настройках бота. Без этого админ-панель не откроется.', 'Открыть настройки', function () { try { bm.openSettings(); } catch (e) {} });
        continue;
      }
      el.innerHTML = '';
      if (await bioAuth(bm)) return;
      await lockScreen(el, 'Подтвердите, что это вы.', 'Разблокировать');
    }
  } finally { el.remove(); }
}
function lockScreen(el, text, btn, extra) {
  return new Promise(function (r) {
    el.innerHTML = '<div class="card"><div class="ico">' + ICO.lock + '</div><b>Админ-панель заблокирована</b><p class="mut">' + esc(text) + '</p><button class="btn pri" id="unl">' + esc(btn) + '</button></div>';
    $('#unl', el).onclick = function () { if (extra) extra(); r(); };
  });
}
var bioBusy = false;
async function bioRelock() {
  if (bioBusy || !S || !bioHiddenAt || Date.now() - bioHiddenAt < BIO_IDLE) { bioHiddenAt = 0; return; }
  bioHiddenAt = 0; bioBusy = true;
  try { await bioGate(); } finally { bioBusy = false; }
}
try {
  if (TGAPP && TGAPP.onEvent) TGAPP.onEvent('homeScreenAdded', function () { homeSt = 'added'; var b = $('#homeCard'); if (b) b.innerHTML = ''; toast('Админка добавлена на главный экран'); });
} catch (e) {}
function bioWatch() {
  if (!bioMgr()) return;
  function away() { if (!bioHiddenAt) bioHiddenAt = Date.now(); }
  if (tgv('8.0')) { try { TGAPP.onEvent('deactivated', away); TGAPP.onEvent('activated', bioRelock); } catch (e) {} }
  document.addEventListener('visibilitychange', function () { if (document.hidden) away(); else bioRelock(); });
}

async function boot() {
  if (TGAPP) {
    document.documentElement.classList.add('tg');
    try { TGAPP.ready(); TGAPP.expand(); } catch (e) {}
    if (tgv('7.7')) { try { TGAPP.disableVerticalSwipes(); } catch (e) {} }
    if (tgv('6.1')) { try { TGAPP.BackButton.onClick(onTgBack); } catch (e) {} }
  }
  var th = 'light';
  try { th = localStorage.getItem('adlcargo-admin-theme') || 'light'; } catch (e) {}
  document.documentElement.setAttribute('data-theme', th === 'dark' ? 'dark' : 'light');
  if (TGAPP) {
    tgColors();
    await bioGate();
    bioWatch();
  }
  // Telegram Login Widget returns here with the signed data in the query string
  var qp = new URLSearchParams(location.search);
  if (qp.get('hash') && qp.get('id') && qp.get('auth_date')) {
    var wd = {};
    qp.forEach(function (v, k) { wd[k] = v; });
    try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) {}
    $('#app').innerHTML = '<div class="login"><div class="card"><div class="spin"></div><div class="mut">Входим…</div></div></div>';
    doLogin({ widget: wd });
    return;
  }
  var raw = null;
  try { raw = sessionStorage.getItem('adm'); } catch (e) {}
  if (raw) {
    try { S = JSON.parse(raw); } catch (e) { S = null; }
    var now = Date.now() / 1000;
    if (S && S.token && S.exp > now + 10 && S.abs > now) {
      api('me').then(function (m) { S.role = m.role; S.name = m.name; startApp(); }).catch(function () { if (S) logout(); });
      return;
    }
    S = null;
    try { sessionStorage.removeItem('adm'); } catch (e) {}
  }
  showLogin();
}

boot();
})();
</script>
