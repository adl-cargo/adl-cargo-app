<title>ADL Cargo — приложение</title>
<meta name="robots" content="noindex">

<style>

:root{box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%}
html[data-theme=light]{--lg:#1C1A17;--lgc:#84613B}
html[data-theme=dark]{--lg:#F2EEE9;--lgc:#C29C67}
/* ---------- Palettes (from the approved F5 mockup) ---------- */
html[data-theme=light]{--lg:#1C1A17;--lgc:#84613B}
html[data-theme=dark]{--lg:#F2EEE9;--lgc:#C29C67}
html[data-pal=kraft][data-theme=light]{--bg:#F2EEE9;--surf:#FBF9F5;--surf2:#E9E3D9;--tx:#1C1A17;--tx2:#3E3A33;--tx3:#6A6256;--line:rgba(28,26,23,.14);--acc:#84643D;--accink:#FFFFFF;--acct:#84643D;--soft:#E3D3B1;--softink:#1C1A17;--inv:#1C1A17;--invtx:#F2EEE9;--shadow:rgba(60,40,10,.12)}
html[data-pal=kraft][data-theme=dark]{--bg:#1C1A17;--surf:#26231F;--surf2:#302C27;--tx:#F2EEE9;--tx2:#D2CBBE;--tx3:#A39B8D;--line:rgba(242,238,233,.14);--acc:#C29C67;--accink:#1C1A17;--acct:#C29C67;--soft:#3A3226;--softink:#F2EEE9;--inv:#F2EEE9;--invtx:#1C1A17;--shadow:rgba(0,0,0,.4)}
html[data-pal=graphite][data-theme=light]{--bg:#F4F2EE;--surf:#FFFFFF;--surf2:#EBE8E2;--tx:#1C1A17;--tx2:#403D37;--tx3:#5F5B54;--line:rgba(28,26,23,.13);--acc:#1C1A17;--accink:#F4F2EE;--acct:#84643D;--soft:#E3D3B1;--softink:#1C1A17;--inv:#1C1A17;--invtx:#F4F2EE;--shadow:rgba(40,30,10,.12)}
html[data-pal=graphite][data-theme=dark]{--bg:#131211;--surf:#1C1A18;--surf2:#262320;--tx:#F4F2EE;--tx2:#D3CFC6;--tx3:#A09B90;--line:rgba(244,242,238,.14);--acc:#F4F2EE;--accink:#131211;--acct:#C29C67;--soft:#3A3226;--softink:#F4F2EE;--inv:#F4F2EE;--invtx:#131211;--shadow:rgba(0,0,0,.5)}
html[data-pal=pine][data-theme=light]{--bg:#F1F4EF;--surf:#FFFFFF;--surf2:#E4EAE2;--tx:#14231B;--tx2:#34493C;--tx3:#4F6556;--line:rgba(20,35,27,.13);--acc:#1F4D3A;--accink:#FFFFFF;--acct:#1F4D3A;--soft:#D3E4D6;--softink:#14231B;--inv:#14231B;--invtx:#F1F4EF;--shadow:rgba(15,60,40,.13)}
html[data-pal=pine][data-theme=dark]{--bg:#0E1713;--surf:#15211B;--surf2:#1D2D25;--tx:#E8F2EB;--tx2:#C3D6CA;--tx3:#8FAA9B;--line:rgba(232,242,235,.14);--acc:#8FCBA5;--accink:#0B1912;--acct:#9ED6B3;--soft:#1F3A2D;--softink:#E8F2EB;--inv:#E8F2EB;--invtx:#0E1713;--shadow:rgba(0,0,0,.5)}
html[data-pal=bordeaux][data-theme=light]{--bg:#F8F2F0;--surf:#FFFFFF;--surf2:#EFE3E0;--tx:#2A1519;--tx2:#503238;--tx3:#74565C;--line:rgba(42,21,25,.13);--acc:#7B2D3B;--accink:#FFFFFF;--acct:#7B2D3B;--soft:#F0D8DA;--softink:#2A1519;--inv:#2A1519;--invtx:#F8F2F0;--shadow:rgba(90,20,35,.13)}
html[data-pal=bordeaux][data-theme=dark]{--bg:#181012;--surf:#22171A;--surf2:#2E2024;--tx:#F8ECEE;--tx2:#E0C8CC;--tx3:#B39499;--line:rgba(248,236,238,.14);--acc:#E58A9B;--accink:#2A0E14;--acct:#EE9DAC;--soft:#43222B;--softink:#F8ECEE;--inv:#F8ECEE;--invtx:#181012;--shadow:rgba(0,0,0,.5)}
html[data-pal=navy][data-theme=light]{--bg:#F2F4F7;--surf:#FFFFFF;--surf2:#E5E9F0;--tx:#111C2D;--tx2:#34435C;--tx3:#546380;--line:rgba(17,28,45,.13);--acc:#1F3A5F;--accink:#FFFFFF;--acct:#1F3A5F;--soft:#D6DEEB;--softink:#111C2D;--inv:#111C2D;--invtx:#F2F4F7;--shadow:rgba(20,40,80,.14)}
html[data-pal=navy][data-theme=dark]{--bg:#0C131F;--surf:#131C2C;--surf2:#1B2740;--tx:#E9EEF8;--tx2:#C0CCE2;--tx3:#8E9FBD;--line:rgba(233,238,248,.14);--acc:#9DBCEB;--accink:#0A1424;--acct:#A9C6F0;--soft:#1D3157;--softink:#E9EEF8;--inv:#E9EEF8;--invtx:#0C131F;--shadow:rgba(0,0,0,.5)}


body{margin:0;background:var(--bg);color:var(--tx);font-family:'Geologica',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--acct);outline-offset:2px;border-radius:6px}
.app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;border-bottom:1px solid var(--line)}
header.bar svg.logo{height:30px;width:auto;display:block}
.hdr-r{display:flex;align-items:center;gap:8px}
.lang{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.lang button{min-width:44px;height:42px;border:0;background:transparent;font-weight:600;font-size:14px;color:var(--tx2)}
.lang button[aria-pressed=true]{background:var(--acc);color:var(--accink)}
.tbtn{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:transparent;display:grid;place-items:center;flex:none}
.swr{display:flex;gap:14px;flex-wrap:wrap}
.swb{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);padding:0;background:var(--c)}
.swb[aria-pressed=true]{border-color:var(--tx);box-shadow:0 0 0 3px var(--surf) inset}
main{flex:1;padding:16px 16px calc(92px + env(safe-area-inset-bottom,0px))}
h1{margin:0 0 4px;font-size:24px;font-weight:700;letter-spacing:-.6px}
.sub{margin:0 0 16px;color:var(--tx2);font-size:14px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surf);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs .in{max-width:560px;margin:0 auto;display:flex}
nav.tabs button{flex:1;min-height:60px;background:transparent;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:500;color:var(--tx3);padding:0 2px}
nav.tabs button[aria-current=page]{color:var(--acct);font-weight:600}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:12px;border:0;font-weight:600;text-decoration:none;white-space:nowrap}
.btn.pri{background:var(--acc);color:var(--accink)}
.btn.pri:disabled{opacity:.55}
.btn.sec{background:transparent;border:1.5px solid var(--tx3);color:var(--tx)}
.btn.block{width:100%}
.btn.sm{min-height:42px;padding:0 14px;font-size:14px}
.btn.danger{color:#B3261E;border-color:#B3261E}
html[data-theme=dark] .btn.danger{color:#FFB4AB;border-color:#FFB4AB}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.vb{display:inline-flex;align-items:center;min-height:38px;padding:0 13px;border-radius:9px;font-size:14px;font-weight:500;background:transparent;border:1px solid var(--line)}
.vb[aria-pressed=true]{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.vb.dim{opacity:.5}
.filters{margin-bottom:14px}
.modebar{margin-bottom:12px}

.lc{display:flex;flex-direction:column;gap:8px;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;cursor:pointer;text-align:left;width:100%}
.lc.vip{border:1.5px solid var(--acc)}
.rt{font-size:17px;font-weight:600;letter-spacing:-.2px;display:flex;align-items:center;flex-wrap:wrap;gap:2px 8px}
.rt svg{color:var(--tx3)}
.meta{font-size:12px;color:var(--tx3)}
.vt{background:var(--soft);color:var(--softink);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:500}
.pl{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px 2px 7px;font-size:12px;font-weight:500}
.pl.vp{background:var(--acc);color:var(--accink)}
.pl.ct{background:var(--soft);color:var(--softink)}
.ds{font-size:14px;color:var(--tx2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.pr{font-weight:600}.pr.neg{color:var(--tx3);font-weight:500}
.st{font-size:12px;font-weight:600;border-radius:6px;padding:2px 8px;background:var(--surf2);color:var(--tx2);white-space:nowrap}
.st.on{background:var(--soft);color:var(--softink)}

.panel{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.panel h2{margin:0 0 6px;font-size:18px}
.panel p{margin:0 0 12px;color:var(--tx2);font-size:14px}
.panel .btn+.btn{margin-top:8px}
.state{padding:20px 4px;color:var(--tx2);font-size:15px}
.note{background:var(--soft);color:var(--softink);border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.kv{display:grid;grid-template-columns:96px 1fr;gap:6px 12px;font-size:15px;margin:0}
.kv dt{color:var(--tx3)}.kv dd{margin:0;word-break:break-word}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 10px}
.sec-h h2{margin:0;font-size:18px}
.item{display:flex;flex-direction:column;gap:8px;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.item .t{font-weight:600}

label.l{display:block;font-size:13px;font-weight:600;color:var(--tx2);margin:16px 0 6px}
.inp{width:100%;min-height:50px;border:1px solid var(--line);border-radius:12px;background:var(--surf);padding:0 14px}
textarea.inp{padding:12px 14px;min-height:96px;resize:vertical}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surf)}
.seg button{flex:1;min-height:46px;border:0;background:transparent;font-weight:600;font-size:14px;color:var(--tx2);padding:0 6px}
.seg button[aria-pressed=true]{background:var(--acc);color:var(--accink)}
.pick{position:relative}
.res{list-style:none;margin:6px 0 0;padding:0;border:1px solid var(--line);border-radius:12px;background:var(--surf);overflow:hidden}
.res li button{width:100%;text-align:left;background:transparent;border:0;padding:12px 14px;border-top:1px solid var(--line);min-height:48px}
.res li:first-child button{border-top:0}
.res small{display:block;color:var(--tx3);font-size:12px}
.chosen{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1.5px solid var(--acc);border-radius:12px;padding:10px 14px;min-height:50px;background:var(--surf);font-weight:600}
.chosen button{background:transparent;border:0;padding:6px 8px;color:var(--tx3)}
.hint{font-size:13px;color:var(--tx3);margin:8px 0 0}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surf);width:100%;text-align:left;min-height:56px}
.sw .t{font-weight:600;font-size:15px}.sw .d{font-size:12px;color:var(--tx3)}
.sw .tog{flex:none;width:46px;height:28px;border-radius:999px;background:var(--surf2);border:1px solid var(--line);position:relative}
.sw .tog::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--tx3);transition:transform .15s}
.sw[aria-pressed=true] .tog{background:var(--acc);border-color:var(--acc)}
.sw[aria-pressed=true] .tog::after{transform:translateX(18px);background:var(--accink)}
.err{color:#B3261E;font-size:14px;margin:12px 0 0}
html[data-theme=dark] .err{color:#FFB4AB}

dialog{width:min(520px,calc(100% - 24px));max-height:calc(100% - 32px);padding:0;border:1px solid var(--line);border-radius:20px;background:var(--surf);color:var(--tx);overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog .in{padding:20px;display:flex;flex-direction:column;gap:14px}
dialog .hd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
dialog h3{margin:0;font-size:20px;letter-spacing:-.4px}
dialog .x{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:transparent;flex:none}
dialog dl{margin:0;display:grid;grid-template-columns:96px 1fr;gap:8px 12px;font-size:15px}
dialog dt{color:var(--tx3)}dialog dd{margin:0;word-break:break-word}
.big2{font-size:26px;font-weight:700;letter-spacing:-.6px}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--inv);color:var(--invtx);padding:12px 18px;border-radius:12px;font-size:14px;font-weight:500;z-index:20;max-width:calc(100% - 32px);text-align:center}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.modes{margin:12px 16px 0}
.cardtop{display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
.thumb{position:relative;flex:none;width:76px;height:76px;border-radius:10px;overflow:hidden;background:var(--surf2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb b{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;border-radius:6px;padding:1px 6px;font-weight:600}
.gal{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px}
.gal button{flex:0 0 78%;scroll-snap-align:start;border:0;padding:0;background:var(--surf2);border-radius:12px;overflow:hidden;height:200px}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.bigimg{width:100%;max-height:60vh;object-fit:contain;background:var(--surf2);border-radius:12px}
.upl{display:flex;flex-wrap:wrap;gap:8px}
.tile{position:relative;width:84px;height:84px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile button{position:absolute;top:3px;right:3px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;display:grid;place-items:center}
.addph{width:84px;height:84px;border-radius:10px;border:1.5px dashed var(--tx3);background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--tx2);font-size:12px;text-align:center;padding:0 4px}
.pickbtn{display:flex;align-items:center;gap:10px;text-align:left;color:var(--tx2);cursor:pointer}
.chlink{flex:1;text-align:left;background:transparent;border:0;font-weight:600;padding:0;min-height:30px}
dialog#pickDlg{width:100%;max-width:none;height:100%;max-height:none;margin:0;border:0;border-radius:0;padding:0}
#pickBody{height:100%;display:flex;flex-direction:column;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(12px + env(safe-area-inset-bottom,0px))}
#pickBody .hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
#pickBody .hd h3{margin:0;font-size:20px}
#pickBody .hint{margin:0}
#pickBody .ttl{font-size:12px;font-weight:600;color:var(--tx3);letter-spacing:.4px;text-transform:uppercase}
#pickBody .res{flex:1;min-height:0;overflow:auto;margin:0}
#pickBody .res .empty{padding:16px 14px;color:var(--tx2)}
</style>
</head>

    dl.appendChild(el('dt', null, t('p_name'))); dl.appendChild(el('dd', null, profile.full_name || (u ? [u.first_name, u.last_name].filter(Boolean).join(' ') : '—')));
    dl.appendChild(el('dt', null, t('p_phone'))); dl.appendChild(el('dd', null, profile.phone || '—'));
    if (profile.rating_count > 0) { dl.appendChild(el('dt', null, t('p_rating'))); dl.appendChild(el('dd', null, '★ ' + Number(profile.rating_avg).toLocaleString('ru-RU', { maximumFractionDigits: 1 }) + ' (' + profile.rating_count + ')')); }
    card.appendChild(dl); body.appendChild(card);
  }

  /* ---------- Look dialog ---------- */
  function openLook() {
    openDlg(function (body) {
      dlgHead(body, el('h3', null, t('look_h')));
      var pal = root.getAttribute('data-pal');
      var saved = readLook();
      var m = saved && (saved.theme === 'light' || saved.theme === 'dark' || saved.theme === 'auto') ? saved.theme : 'light';
      body.appendChild(el('div', 'meta', t('look_color')));
      var row = el('div', 'swr');
      PALS.forEach(function (p) {
        var nameP = t('pal_' + p[0]);
        var b = el('button', 'swb'); b.type = 'button'; b.style.setProperty('--c', p[1]); b.setAttribute('aria-label', nameP); b.title = nameP; b.setAttribute('aria-pressed', String(pal === p[0]));
        b.addEventListener('click', function () { saveLook({ pal: p[0] }); openLook(); });
        row.appendChild(b);
      });
      body.appendChild(row);
      body.appendChild(el('div', 'hint', t('pal_' + pal)));
      body.appendChild(el('div', 'meta', t('look_theme')));
      var seg = el('div', 'seg');
      [['light', t('th_light')], ['dark', t('th_dark')], ['auto', t('th_auto')]].forEach(function (o) {
        var b = el('button', null, o[1]); b.type = 'button'; b.setAttribute('aria-pressed', String(o[0] === m));
        b.addEventListener('click', function () { saveLook({ theme: o[0] }); openLook(); });
        seg.appendChild(b);
      });
      body.appendChild(seg);
    });
  }
  $('lookBtn').addEventListener('click', openLook);

  /* ---------- Mode switch (shipper / driver), tabs, navigation ---------- */
  var TABS = {
    shipper: [['create', 'tab_create', P.plus], ['mine', 'tab_mine', P.list], ['profile', 'tab_profile', P.user]],
    driver: [['feed', 'tab_feed', P.lines], ['fleet', 'tab_fleet', P.truck], ['profile', 'tab_profile', P.user]]
  };
  function renderModeSw() {
    var box = $('modeSw'); box.textContent = '';
    [['shipper', t('mode_ship')], ['driver', t('mode_drv')]].forEach(function (o) {
      var b = el('button', null, o[1]); b.type = 'button'; b.setAttribute('data-mode', o[0]); b.setAttribute('aria-pressed', String(uiMode === o[0]));
      b.addEventListener('click', function () { userTouched = true; setUiMode(o[0]); });
      box.appendChild(b);
    });
  }
  function renderTabs() {
    var box = $('tabsIn'); box.textContent = '';
    TABS[uiMode].forEach(function (tb) {
      var b = el('button'); b.type = 'button'; b.setAttribute('data-tab', tb[0]);
      b.appendChild(icon(tb[2], 22)); b.appendChild(el('span', null, t(tb[1])));
      if (tb[0] === current) b.setAttribute('aria-current', 'page');
      b.addEventListener('click', function () { userTouched = true; show(tb[0]); });
      box.appendChild(b);
    });
  }
  function setUiMode(m) {
    if (m === uiMode) return;
    function apply() {
      uiMode = m; uiSaved = true;
      try { localStorage.setItem(UI_KEY, m); } catch (e) {}
      renderModeSw(); show(m === 'driver' ? 'feed' : 'create');
    }
    if (m === 'driver' && inTg && session && profile && !isDriver()) {
      patch('profiles?id=eq.' + encodeURIComponent(session.user_id), { role: 'both' })
        .then(function () { profile.role = 'both'; toast(t('drv_on')); apply(); })
        .catch(function (e) { toast(friendly(e.message)); });
    } else apply();
  }
  function show(name) {
    if (!TABS[uiMode].some(function (tb) { return tb[0] === name; })) name = TABS[uiMode][0][0];
    current = name;
    ['feed', 'create', 'mine', 'fleet', 'profile'].forEach(function (n) { $('v-' + n).hidden = n !== name; });
    renderTabs();
    window.scrollTo(0, 0);
    if (name === 'feed') {
      renderFeedModeBar();
      if (!feedAll || feedAll === 'error') loadFeed(); else renderFeed();
      if (feedMode === 'me' && (feedMe === null || feedMe === 'error')) loadMe();
    }
    if (name === 'create') renderCreate();
    if (name === 'mine') { if (!mineRows || mineRows === 'error') loadMine(); else renderMine(); }
    if (name === 'fleet') renderFleet();
    if (name === 'profile') renderProfile();
  }

  /* ---------- Language switching ---------- */
  function applyStatic() {
    document.documentElement.lang = lang;
    document.title = t('title');
    [].forEach.call(document.querySelectorAll('[data-i18n]'), function (n) { n.textContent = t(n.getAttribute('data-i18n')); });
    [].forEach.call(document.querySelectorAll('[data-i18n-aria]'), function (n) { n.setAttribute('aria-label', t(n.getAttribute('data-i18n-aria'))); });
    $('pickDlg').setAttribute('aria-label', t('pick_choose'));
    [].forEach.call(document.querySelectorAll('#langBar button'), function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-lang') === lang)); });
  }
  function renderAll() {
    applyStatic(); closeDlg(); closePick(); renderModeSw(); renderTabs(); renderFeedModeBar(); renderFilters();
    renderFeed(); renderCreate(); renderMine(); renderFleet(); renderProfile();
  }
  [].forEach.call(document.querySelectorAll('#langBar button'), function (b) {
    b.addEventListener('click', function () {
      var l = b.getAttribute('data-lang'); if (l === lang) return;
      lang = l; langSaved = true;
      try { localStorage.setItem(LANG_KEY, l); } catch (e) {}
      renderAll();
      if (session && profile) patch('profiles?id=eq.' + encodeURIComponent(session.user_id), { language: l }).catch(function () {});
    });
  });

  /* ---------- Boot ---------- */
  if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }
  applyStatic(); renderModeSw(); renderFilters();
  show(uiMode === 'driver' ? 'feed' : 'create');
  rest('vehicle_types?select=code,name_ru,name_uz,max_weight_kg,parent_code,sort_order&is_active=eq.true&order=sort_order')
    .then(function (rows) { types = rows; indexTypes(); renderFilters(); renderFeed(); if (current === 'create') renderCreate(); if (current === 'fleet') renderFleet(); })
    .catch(function () {});
  rest('place_types?select=code,name_ru,name_uz').then(function (rows) { rows.forEach(function (x) { ptypes[x.code] = x; }); }).catch(function () {});

  if (inTg) {
    login().then(function () {
      return rest('profiles?select=full_name,phone,role,language,rating_avg,rating_count&id=eq.' + encodeURIComponent(session.user_id)).then(function (rows) { profile = rows[0] || { phone: null, role: 'shipper', language: 'ru' }; });
    }).then(function () {
      /* Uzbek if either Telegram or the saved profile says so; a choice made in the app always wins */
      if (!langSaved && profile.language === 'uz' && lang !== 'uz') { lang = 'uz'; applyStatic(); renderModeSw(); renderFilters(); }
      return loadDriver();
    }).then(function () {
      if (!feedModeSet) feedMode = hasDriverSetup() ? 'me' : 'all';
      /* A person registered as a driver starts in driver mode, unless they already chose or tapped something */
      if (!uiSaved && !userTouched && profile.role === 'driver') { uiMode = 'driver'; renderModeSw(); show('feed'); }
      else show(current);
      if (current === 'feed' && feedMode === 'me') loadMe();
    }).catch(function () { toast(t('login_fail')); });
  } else {
    renderFeedModeBar();
  }
})();
</script>
</body>
</html>
